# Cursor/VS Code Git UI can't render ANSI spinners — keep hook output plain.
no_tty: true
colors: false

pre-commit:
  # sequential: format rewrites files, lint and types must see the result
  parallel: false
  commands:
    format:
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run format
      stage_fixed: true
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run lint
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run ts:check
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
