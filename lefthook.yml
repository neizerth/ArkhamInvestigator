# Cursor/VS Code Git UI can't render ANSI spinners — keep hook output plain.
no_tty: true
colors: false

pre-commit:
  # sequential: check --write rewrites files, types must see the result
  parallel: false
  commands:
    check:
      priority: 1
      glob: "*.{js,ts,jsx,tsx}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      priority: 2
      glob: "*.{ts,tsx}"
      run: npm run ts:check
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
