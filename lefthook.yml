# Cursor/VS Code Git UI can't render ANSI spinners — keep hook output plain.
no_tty: true
colors: false

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run lint
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run ts:check
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
# tests run once per push, not per commit; e2e runs separately
pre-push:
  commands:
    test:
      run: npm test -- --bail --passWithNoTests --changedSince=main
