# iOS Simulator client of the 3/4-device suite: `-e NICKNAME="E2E Client A" -e SIGNATURE=signature-02001`
# (B: signature-03001, C: signature-04001). `-e LAST=true` only for the client that answers the
# host with the final health change (the host waits for 7). See multi-host.yaml.
appId: ${APP_ID}
---
- launchApp:
    permissions:
      location: inuse
- extendedWaitUntil:
    visible: "Single player|Continue"
    timeout: 300000
- tapOn:
    id: "home-multiplayer"
- extendedWaitUntil:
    visible:
      id: "modal-action-start-new-game"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: "modal-action-start-new-game"
    commands:
      - tapOn:
          id: "modal-action-start-new-game"
- extendedWaitUntil:
    visible:
      id: "multiplayer-nickname-input"
    timeout: 45000
- tapOn:
    id: "multiplayer-nickname-input"
- eraseText
- inputText: ${NICKNAME}
- hideKeyboard
- tapOn:
    id: "tab-client"
- extendedWaitUntil:
    visible:
      id: "multiplayer-client-auto-discover"
    timeout: 15000
# the setting is remembered between runs: the checkbox label ends with a glyph, U+F64B when it is on
- runFlow:
    when:
      notVisible:
        id: "multiplayer-client-auto-discover"
        text: ".*\uf64b"
    commands:
      - tapOn:
          id: "multiplayer-client-auto-discover"
- extendedWaitUntil:
    visible:
      id: "multiplayer-discovered-host-E2E Host"
    timeout: 300000
- tapOn:
    id: "multiplayer-discovered-host-E2E Host"

# the host pressed Next: pick this client's investigator
- extendedWaitUntil:
    visible:
      id: ${SIGNATURE}
    timeout: 600000
- tapOn:
    id: ${SIGNATURE}
- extendedWaitUntil:
    visible: ".*Okay"
    timeout: 10000
- tapOn: ".*Okay"

- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 600000
# host -> client: 9 -> 8 (the board shows the host's investigator first)
- extendedWaitUntil:
    visible:
      id: "health-value"
      text: "8"
    timeout: 120000

# the last client answers the host: 8 -> 7
- runFlow:
    when:
      true: ${LAST == 'true'}
    commands:
      - tapOn:
          id: "board-health"
      - extendedWaitUntil:
          visible:
            id: "health-value"
            text: "7"
          timeout: 10000
