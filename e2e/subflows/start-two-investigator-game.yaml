# Starts a single player game with two investigators, which is what the overview needs.
# It replaces the saved game, so only the overview flow uses it.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Single player|Continue"
    timeout: 300000
- tapOn: "Single player"
# a saved game is replaced only after a confirmation; the dialog takes a beat to render (on iOS
# longer than the immediate `when: visible` check below), so wait for it, tolerating a fresh install
- extendedWaitUntil:
    visible:
      id: "modal-action-start-new-game"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "modal-action-start-new-game"
    commands:
      - tapOn:
          id: "modal-action-start-new-game"
- extendedWaitUntil:
    visible: ".*Choose an Investigator.*"
    timeout: 30000
# Roland Banks and Daisy Walker, the first two investigators of the first chapter
- tapOn:
    id: "signature-01001"
- extendedWaitUntil:
    visible: ".*Okay"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Okay"
    commands:
      - tapOn: ".*Okay"
- tapOn:
    id: "signature-02001"
- extendedWaitUntil:
    visible: ".*Okay"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Okay"
    commands:
      - tapOn: ".*Okay"
- tapOn: "Start.*"
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 60000
