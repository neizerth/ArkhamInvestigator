# Starts a single player game with two investigators, which is what the overview needs.
# It replaces the saved game, so only the overview flow uses it.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Single player|Continue"
    timeout: 300000
- tapOn: "Single player"
# a saved game is replaced only after a confirmation
- runFlow:
    when:
      visible: "Okay"
    commands:
      - tapOn: "Okay"
- extendedWaitUntil:
    visible: "Choose an Investigator"
    timeout: 30000
# Roland Banks and Daisy Walker, the first two investigators of the first chapter
- tapOn:
    id: "signature-01001"
- runFlow:
    when:
      visible: "Okay"
    commands:
      - tapOn: "Okay"
- tapOn:
    id: "signature-02001"
- runFlow:
    when:
      visible: "Okay"
    commands:
      - tapOn: "Okay"
- tapOn: "Start"
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 60000
