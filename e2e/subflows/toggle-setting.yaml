# Flips the ${SETTING} checkbox and returns to the board. Settings open straight from the
# board description panel, so the app keeps running.
appId: ${APP_ID}
---
- runFlow: ./open-board.yaml
# the panel is opened by its own id; the tap goes to the notebook at the bottom of it,
# because the middle of the panel is empty space above the notebook
- tapOn:
    id: "board-description"
    point: "50%,78%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "board-description-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${SETTING}"
    direction: DOWN
    timeout: 30000
- tapOn: "${SETTING}"
# the system back button closes the app, so the screen's own arrow it is
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 30000
