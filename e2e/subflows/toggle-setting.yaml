# Flips the ${SETTING} checkbox and returns to the board. Settings open straight from the
# board description panel, so the app keeps running.
appId: ${APP_ID}
---
- runFlow: ./open-board.yaml
# the traits line is not always rendered, so the panel is opened by its own id
- tapOn:
    id: "board-description"
- waitForAnimationToEnd:
    timeout: 5000
# the panel menu has no text: settings are the fourth icon of the row
- tapOn:
    point: "72%,52%"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${SETTING}"
    direction: DOWN
    timeout: 30000
- tapOn: "${SETTING}"
# the system back button closes the app, so the screen's own arrow it is
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 30000
