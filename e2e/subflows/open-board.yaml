# Opens the board and makes sure it is actually reachable: the app is left running
# between flows, so a screen left on top would swallow every gesture while the board
# itself is still visible in the accessibility tree. Expects the English locale.
appId: ${APP_ID}
---
# the app is left running between flows: a cold start costs about a minute
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible:
        id: "board-health"
    commands:
      - extendedWaitUntil:
          visible: "Single player|Continue"
          # a dev build cold start is slow, and the first launch also downloads assets
          timeout: 300000
      # a saved game is resumed, otherwise a new one is started below
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - extendedWaitUntil:
                visible:
                  id: "board-health"
                timeout: 30000
      - runFlow:
          when:
            notVisible:
              id: "board-health"
          commands:
            - tapOn: "Single player"
            - extendedWaitUntil:
                visible: "Choose an Investigator"
                timeout: 30000
            # first investigator card of the default faction
            - tapOn:
                point: "18%,30%"
            - runFlow:
                when:
                  visible: "Okay"
                commands:
                  - tapOn: "Okay"
            - tapOn: "Start"

# drops whatever modal a previous flow left on top of the board: every modal screen
# dims the rest with the same pressable, and pressing it closes the modal
- repeat:
    times: 5
    while:
      visible:
        id: "modal-outside"
    commands:
      # bare backdrop under the status bar: the center would hit the modal itself
      - tapOn:
          point: "5%,9%"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 30000
- assertNotVisible:
    id: "modal-outside"

# the description panel is in-page state and its hide button sits under the navigation
# bar, so only a restart clears it: on rehydration the persist transform closes it
- runFlow:
    when:
      visible:
        id: "board-description-open"
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 300000
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible:
            id: "board-health"
          timeout: 60000
- assertNotVisible:
    id: "board-description-open"
