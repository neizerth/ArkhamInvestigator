# Opens the board: resumes the current game or starts a single player one with the first
# investigator. Expects the English locale.
appId: ${APP_ID}
---
# the app is left running between flows: a cold start costs about a minute
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible:
        id: "board-health"
    commands:
      - extendedWaitUntil:
          visible: "Single player|Continue"
          # a dev build cold start is slow, and the first launch also downloads assets
          timeout: 300000
      # a saved game is resumed, otherwise a new one is started below
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - extendedWaitUntil:
                visible:
                  id: "board-health"
                timeout: 30000
      - runFlow:
          when:
            notVisible:
              id: "board-health"
          commands:
            - tapOn: "Single player"
            - extendedWaitUntil:
                visible: "Choose an Investigator"
                timeout: 30000
            # first investigator card of the default faction
            - tapOn:
                point: "18%,30%"
            - runFlow:
                when:
                  visible: "Okay"
                commands:
                  - tapOn: "Okay"
            - tapOn: "Start"
- extendedWaitUntil:
    visible:
      id: "board-health"
    timeout: 30000

# the description panel covers the stats, and it survives between flows
- runFlow:
    when:
      visible:
        id: "board-description-open"
    commands:
      - tapOn:
          id: "board-description-hide"
      - extendedWaitUntil:
          notVisible:
            id: "board-description-open"
          timeout: 10000
