# Board investigator doom: hidden behind the "Doom" setting, so the flow turns it on,
# checks tap and long press, and turns it back off (off is the default).
# The picker animates to the new value, so every assertion after a gesture waits for it.
appId: ${APP_ID}
---
- runFlow: ../../subflows/open-board.yaml
# the checkbox is flipped blindly, so an interrupted run may have left it on:
# flip once, and once more if doom still is not there
- runFlow:
    when:
      notVisible:
        id: "investigator-doom-picker"
    commands:
      - runFlow: ../../subflows/toggle-doom-setting.yaml
      - runFlow: ../../subflows/open-board.yaml
- runFlow:
    when:
      notVisible:
        id: "investigator-doom-picker"
    commands:
      - runFlow: ../../subflows/toggle-doom-setting.yaml
      - runFlow: ../../subflows/open-board.yaml
- assertVisible:
    id: "investigator-doom-picker"

# long press clears the doom, whatever the previous run left
- longPressOn:
    id: "investigator-doom-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-doom-value"
      text: "0"
    timeout: 5000

- tapOn:
    id: "investigator-doom-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-doom-value"
      text: "1"
    timeout: 5000

- longPressOn:
    id: "investigator-doom-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-doom-value"
      text: "0"
    timeout: 5000

# back to the default, so the other flows see the board they expect
- runFlow: ../../subflows/toggle-doom-setting.yaml
- runFlow: ../../subflows/open-board.yaml
- extendedWaitUntil:
    notVisible:
      id: "investigator-doom-picker"
    timeout: 10000
