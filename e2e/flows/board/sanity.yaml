# Board sanity: tap and long press. Normalizes the value to 0 first, so the flow does not
# depend on the investigator or on the state left by a previous run.
# The picker animates to the new value, so every assertion after a gesture waits for it.
# Swipes are covered by unit tests: the app uses RNGH fling gestures, which Maestro's
# synthetic swipes do not trigger.
appId: ${APP_ID}
---
- runFlow: ../../subflows/open-board.yaml

# long press resets the base value when it differs from the initial one
- runFlow:
    when:
      visible:
        id: "sanity-base-value"
    commands:
      - longPressOn:
          id: "board-sanity"
- extendedWaitUntil:
    notVisible:
      id: "sanity-base-value"
    timeout: 5000

# tap decreases the value and stops at 0 (negative values are off by default)
- repeat:
    times: 25
    while:
      notVisible:
        id: "sanity-value"
        text: "0"
    commands:
      - tapOn:
          id: "board-sanity"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "sanity-value"
      text: "0"
    timeout: 5000

# long press with base == initial: value +1, base +1
- longPressOn:
    id: "board-sanity"
- extendedWaitUntil:
    visible:
      id: "sanity-value"
      text: "1"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "sanity-base-value"
      text: "\\+1"
    timeout: 5000

# long press with base != initial: base resets to initial, value loses the difference
- longPressOn:
    id: "board-sanity"
- extendedWaitUntil:
    visible:
      id: "sanity-value"
      text: "0"
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "sanity-base-value"
    timeout: 5000
