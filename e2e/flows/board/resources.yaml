# Board investigator resources: long press clears them, tap spends one and stops at zero.
# The picker animates to the new value, so every assertion after a gesture waits for it.
appId: ${APP_ID}
---
- runFlow: ../../subflows/open-board.yaml

# long press clears the resources, whatever the previous run left
- longPressOn:
    id: "investigator-resources-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-resources-value"
      text: "0"
    timeout: 5000

# tapping at zero must not go negative
- tapOn:
    id: "investigator-resources-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-resources-value"
      text: "0"
    timeout: 5000
