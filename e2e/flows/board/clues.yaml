# Board investigator clues: long press clears them, tap adds one.
# The picker animates to the new value, so every assertion after a gesture waits for it.
appId: ${APP_ID}
---
- runFlow: ../../subflows/open-board.yaml

# long press clears the clues, whatever the previous run left
- longPressOn:
    id: "investigator-clues-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-clues-value"
      text: "0"
    timeout: 5000

- tapOn:
    id: "investigator-clues-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-clues-value"
      text: "1"
    timeout: 5000

- tapOn:
    id: "investigator-clues-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-clues-value"
      text: "2"
    timeout: 5000

- longPressOn:
    id: "investigator-clues-picker"
- extendedWaitUntil:
    visible:
      id: "investigator-clues-value"
      text: "0"
    timeout: 5000
