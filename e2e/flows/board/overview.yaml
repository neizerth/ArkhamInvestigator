# The overview: one row per investigator, only reachable with two of them.
# It starts its own game, so it leaves the board with two investigators behind.
#
# The flow stops at the layout: the rows update the store but keep showing the old
# number, so there is nothing stable to assert about their values yet.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        id: "overview-2-health-picker"
    commands:
      - runFlow: ../../subflows/start-two-investigator-game.yaml
      # the header title opens the overview once a second investigator is there
      - tapOn:
          point: "50%,7%"
      - waitForAnimationToEnd:
          timeout: 5000

# every stat of every row carries its own id
- extendedWaitUntil:
    visible:
      id: "overview-1-health-picker"
    timeout: 20000
- assertVisible:
    id: "overview-1-sanity-picker"
- assertVisible:
    id: "overview-1-clues-picker"
- assertVisible:
    id: "overview-1-resources-picker"
- assertVisible:
    id: "overview-1-actions-picker"
- assertVisible:
    id: "overview-2-health-picker"
- assertVisible:
    id: "overview-2-actions-picker"
