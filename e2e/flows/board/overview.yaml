# The overview: one row per investigator, only reachable with two of them.
# It starts its own game, so it leaves the board with two investigators behind.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        id: "overview-2-health-picker"
    commands:
      - runFlow: ../../subflows/start-two-investigator-game.yaml
      # the header title opens the overview once a second investigator is there
      - tapOn:
          point: "50%,7%"
      - waitForAnimationToEnd:
          timeout: 5000

- extendedWaitUntil:
    visible:
      id: "overview-1-health-picker"
    timeout: 20000
- assertVisible:
    id: "overview-2-health-picker"

# tapping a stat of one row leaves the other one alone
- repeat:
    times: 25
    while:
      notVisible:
        id: "overview-1-health-value"
        text: "0"
    commands:
      - tapOn:
          id: "overview-1-health-picker"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "overview-1-health-value"
      text: "0"
    timeout: 5000
- assertNotVisible:
    id: "overview-2-health-value"
    text: "0"

# clues go up by a tap and are cleared by a long press
- tapOn:
    id: "overview-1-clues-picker"
- extendedWaitUntil:
    visible:
      id: "overview-1-clues-value"
      text: "1"
    timeout: 5000
- longPressOn:
    id: "overview-1-clues-picker"
- extendedWaitUntil:
    visible:
      id: "overview-1-clues-value"
      text: "0"
    timeout: 5000
